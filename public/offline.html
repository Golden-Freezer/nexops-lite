<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#22C55E" />
    <title>오프라인 — NexOps</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8fafc;
        color: #334155;
        font-family: system-ui, -apple-system, sans-serif;
      }
      main {
        width: min(100%, 420px);
        padding: 40px 28px;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        background: #fff;
        text-align: center;
        box-shadow: 0 8px 30px rgb(15 23 42 / 8%);
      }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { margin: 20px 0 8px; font-size: 20px; }
      p { margin: 0; color: #64748b; font-size: 14px; line-height: 1.7; }
      button {
        width: 100%;
        min-height: 44px;
        margin-top: 24px;
        border: 0;
        border-radius: 10px;
        background: #22c55e;
        color: #fff;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/nexops-192.png" alt="" />
      <h1>인터넷 연결을 확인해주세요</h1>
      <p>
        NexOps의 운영 데이터는 보안을 위해 기기에 저장하지 않습니다.<br />
        연결이 복구되면 최신 재고와 정산 정보를 다시 불러올 수 있습니다.
      </p>
      <button type="button" onclick="location.reload()">다시 연결</button>
    </main>
  </body>
</html>
